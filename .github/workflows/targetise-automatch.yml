name: Targetise AutoMatch dry-run trigger

# Only triggers the Targetise backend. All scoring, consent, budget, safety,
# approval and distribution rules stay in Targetise, not in GitHub.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: targetise-automatch
  cancel-in-progress: false

jobs:
  call-targetise:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TARGETISE_CRON_SECRET: ${{ secrets.TARGETISE_AUTOMATCH_CRON_SECRET }}
    steps:
      - name: Configuration status
        if: env.TARGETISE_CRON_SECRET == ''
        run: echo "No scheduler secret configured. Skipping safely."

      - name: Trigger Targetise dry-run and validate result
        if: env.TARGETISE_CRON_SECRET != ''
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(curl --silent --show-error --max-time 40 \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "x-targetise-automatch-secret: ${TARGETISE_CRON_SECRET}" \
            --data '{"action":"cron"}' \
            'https://targetise.base44.app/functions/targetiseAutoMatch')"
          if [ "$http_status" != "200" ]; then
            echo "AutoMatch endpoint did not return HTTP 200 (status $http_status)."
            exit 1
          fi
          python3 - "$response_file" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          if not data.get('ok') or not data.get('dry_run'):
              raise SystemExit("Targetise refused safe dry-run response. No automatic invitations attempted.")
          print("Targetise dry-run succeeded.")
          print("Campaign settings checked:",data.get("campaigns_checked",0))
          print("Matching proposals:",len(data.get("proposals") or []))
          print("Placements created:",data.get("placements_created",0))
          print("Notifications sent:",data.get("notifications_sent",0))
          if data.get("placements_created",0) or data.get("notifications_sent",0):
              raise SystemExit("Unexpected write during scheduled dry-run.")
          PY
